name: CI/Registry

on:
  workflow_dispatch:
    inputs:
      app:
        description: 'App to deploy (e.g., "web", "api", "all")'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - web
          - api

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # Job to determine app matrix and environment
  setup:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      environment: ${{ steps.set-env.outputs.environment }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Determine Environment
        id: set-env
        run: |
          BRANCH="${{ github.ref_name }}"
          if [ "$BRANCH" == "production" ]; then
            echo "environment=production" >> $GITHUB_OUTPUT
            echo "Environment: production"
          elif [ "$BRANCH" == "staging" ]; then
             echo "environment=staging" >> $GITHUB_OUTPUT
             echo "Environment: staging"
          elif [ "$BRANCH" == "develop" ]; then
             echo "environment=development" >> $GITHUB_OUTPUT
             echo "Environment: development"
          else
             # Default to development for feature branches or others
             echo "environment=development" >> $GITHUB_OUTPUT
             echo "Environment: development (default)"
          fi

      - name: Determine Matrix
        id: set-matrix
        run: |
          # List all directories in apps/
          APPS=$(find apps -mindepth 1 -maxdepth 1 -type d -exec basename {} \;)

          # Filter based on input
          SELECTED_APP="${{ inputs.app }}"

          if [ "$SELECTED_APP" == "all" ]; then
            FINAL_APPS=$(echo "$APPS" | jq -R -s -c 'split("\n")[:-1]')
          else
            # Verify the selected app exists
            if echo "$APPS" | grep -q "^$SELECTED_APP$"; then
               FINAL_APPS="[\"$SELECTED_APP\"]"
            else
               echo "Error: App $SELECTED_APP not found"
               exit 1
            fi
          fi

          echo "matrix=$FINAL_APPS" >> $GITHUB_OUTPUT
          echo "Selected Apps: $FINAL_APPS"

  build-and-push:
    needs: setup
    runs-on: ubuntu-latest
    environment: ${{ needs.setup.outputs.environment }}
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        app: ${{ fromJson(needs.setup.outputs.matrix) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 8

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm turbo run lint --filter=${{ matrix.app }}

      # Fail-safe: Uncomment to block build on test failure
      # - name: Test
      #   run: pnpm turbo run test --filter=${{ matrix.app }}

      - name: Get App Version
        id: version
        run: |
          VERSION=$(jq -r .version apps/${{ matrix.app }}/package.json)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-${{ matrix.app }}
          tags: |
            # Production (main) -> latest, 1.0.0
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=${{ steps.version.outputs.version }},enable=${{ github.ref == 'refs/heads/main' }}

            # Staging (staging) -> beta, beta-1.0.0
            type=raw,value=beta,enable=${{ github.ref == 'refs/heads/staging' }}
            type=raw,value=beta-${{ steps.version.outputs.version }},enable=${{ github.ref == 'refs/heads/staging' }}

            # Development (develop) -> dev, dev-1.0.0
            type=raw,value=dev,enable=${{ github.ref == 'refs/heads/develop' }}
            type=raw,value=dev-${{ steps.version.outputs.version }},enable=${{ github.ref == 'refs/heads/develop' }}

            # Feature branches -> feat-branchname
            type=ref,event=branch,enable=${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/develop' && github.ref != 'refs/heads/staging' }}

      - name: Check if Tag Exists
        id: check_tag
        env:
          DOCKER_CLI_EXPERIMENTAL: enabled
        run: |
          # We check the specific version tag
          TAG="${{ steps.version.outputs.version }}"
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-${{ matrix.app }}"

          # Only check strict version collision if we are on main
          # For Dev/Staging, we typically allow overwriting or moving tags (like 'dev')
          # But if you want strictness on dev-1.0.0 as well, we can enable it.
          # For now, let's enforce strictness only on Production releases (main).

          if [ "${{ github.ref_name }}" == "production" ]; then
            if docker manifest inspect $IMAGE:$TAG > /dev/null 2>&1; then
               echo "::error::Tag $TAG already exists for $IMAGE. Please increment version in package.json."
               exit 1
            fi
          fi

      - name: Resolve Environment Variables
        id: envs
        shell: bash
        run: |
          APP_NAME="${{ matrix.app }}"
          # Convert app name to uppercase (e.g., 'web' -> 'WEB')
          PREFIX=$(echo "$APP_NAME" | tr '[:lower:]' '[:upper:]')_

          echo "Resolving envs with prefix: $PREFIX"

          # Use Vars Context (Configuration Variables)
          # We iterate over the 'vars' context which contains environment-specific variables
          VARS_JSON='${{ toJSON(vars) }}'

          echo "Processing Variables..."
          echo "$VARS_JSON" | jq -r --arg prefix "$PREFIX" 'to_entries | .[] | select(.key | startswith($prefix)) | "\(.key | sub($prefix; ""))=\(.value)"' > build_vars.env

          # Note: Secrets are not automatically dumped here for security.
          # To use secrets, you should usually map them explicitly or use a specific secret JSON pattern.
          # For now, this handles configuration variables (VARS).

          {
            echo "build_args<<EOF"
            cat build_vars.env
            echo "EOF"
          } >> $GITHUB_OUTPUT

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            ${{ steps.envs.outputs.build_args }}
