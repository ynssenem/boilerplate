name: CI/Registry

on:
  workflow_dispatch:
    inputs:
      app:
        description: 'App to deploy (e.g., "web", "api", "all")'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - web
          - api

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # Job to determine which apps to build
  setup:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Determine Matrix
        id: set-matrix
        run: |
          # List all directories in apps/
          APPS=$(find apps -mindepth 1 -maxdepth 1 -type d -exec basename {} \;)

          # Filter based on input
          SELECTED_APP="${{ inputs.app }}"

          if [ "$SELECTED_APP" == "all" ]; then
            FINAL_APPS=$(echo "$APPS" | jq -R -s -c 'split("\n")[:-1]')
          else
            # Verify the selected app exists
            if echo "$APPS" | grep -q "^$SELECTED_APP$"; then
               FINAL_APPS="[\"$SELECTED_APP\"]"
            else
               echo "Error: App $SELECTED_APP not found"
               exit 1
            fi
          fi

          echo "matrix=$FINAL_APPS" >> $GITHUB_OUTPUT
          echo "Selected Apps: $FINAL_APPS"

  build-and-push:
    needs: setup
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        app: ${{ fromJson(needs.setup.outputs.matrix) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 8

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm turbo run lint --filter=${{ matrix.app }}

      # Fail-safe: Uncomment to block build on test failure
      # - name: Test
      #   run: pnpm turbo run test --filter=${{ matrix.app }}

      - name: Get App Version
        id: version
        run: |
          VERSION=$(jq -r .version apps/${{ matrix.app }}/package.json)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-${{ matrix.app }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=${{ steps.version.outputs.version }},enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=beta,enable=${{ endsWith(github.ref, 'beta') }}
            type=raw,value=beta-${{ steps.version.outputs.version }},enable=${{ endsWith(github.ref, 'beta') }}
            type=raw,value=alpha,enable=${{ endsWith(github.ref, 'alpha') }}
            type=raw,value=alpha-${{ steps.version.outputs.version }},enable=${{ endsWith(github.ref, 'alpha') }}
            type=ref,event=branch

      - name: Check if Tag Exists
        id: check_tag
        env:
          DOCKER_CLI_EXPERIMENTAL: enabled
        run: |
          # We check the specific version tag
          TAG="${{ steps.version.outputs.version }}"
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-${{ matrix.app }}"

          # Only check strict version collision if we are on main/beta/alpha branches, 
          # relying on the metadata-action outputs would be dynamic, but let's check the primary version tag
          if docker manifest inspect $IMAGE:$TAG > /dev/null 2>&1; then
             echo "::error::Tag $TAG already exists for $IMAGE. Please increment version in package.json."
             exit 1
          else
             echo "Tag available."
          fi

      - name: Resolve Environment Variables
        id: envs
        shell: bash
        run: |
          APP_NAME="${{ matrix.app }}"
          # Convert app name to uppercase (e.g., 'web' -> 'WEB')
          PREFIX=$(echo "$APP_NAME" | tr '[:lower:]' '[:upper:]')_

          echo "Resolving envs with prefix: $PREFIX"

          # Create line separated build-args string
          BUILD_ARGS=""

          # Loop through secrets (this requires secrets to be available in env or passed entirely)
          # GitHub Actions doesn't easily let us iterate raw secrets context in shell for security.
          # WORKAROUND: We must map specific known keys OR dump context (unsafe).
          # BETTER APPROACH: Use the 'vars' context for public non-secrets and map secrets manually if possible,
          # OR use a convention where we assume key names.

          # Since we cannot iterate ${{ secrets }} in run script directly without exposing them,
          # we have to rely on user inputs or explicitly listed keys. 
          # However, for a generic solution without listing every key, we can try to use a JSON input of secrets? No.

          # Alternative: The user asked for "project specific ENV".
          # We will construct a build-args list from the available env context if we map them.
          # But we can't map *all* secrets to env automatically.

          # Updated strategy: We will just allow specific prefixes if known, OR
          # we assume the user has added them to the repository variables/secrets using the naming convention.
          # For the sake of this dynamic script, we'll try to use `tojson(secrets)` but that's redacted.

          # Let's use a smarter way: 
          # We can't dynamically grab secrets by prefix in the shell easily securely.
          # We will instruct the user to map them.
          # BUT, we can iterate environment variables if we map them *all* in the `env` block? No.

          # REFINED STRATEGY FOR THIS STEP:
          # We will skip dynamic secret iteration (security risk/hard) and instead
          # assume a standard set or provide instructions.
          # HOWEVER, for the prompt's request: "detect automatically" - 
          # The best way in GHA is to dump `toJSON(vars)` which IS accessible.
          # For Secrets, it's harder.

          # Let's handle `vars` (Configuration) dynamically:
          VARS_JSON='${{ toJSON(vars) }}'

          echo "Processing Variables..."
          echo "$VARS_JSON" | jq -r --arg prefix "$PREFIX" 'to_entries | .[] | select(.key | startswith($prefix)) | "\(.key | sub($prefix; ""))=\(.value)"' > build_vars.env

          # For Secrets, we can't iterate safely unless we pass a specific JSON secret containing all keys, 
          # or explicitly map them. 
          # To satisfy usage without complexity, we'll suggest using a JSON secret or assume manual mapping in a real enterprise setup.
          # BUT, here is a trick: We can pass specific common patterns if needed.
          # For now, we will just use the Vars dynamic mapping and warn about secrets.

          # Let's convert the .env file to multi-line output for build-args
          # The docker/build-push-action `build-args` input accepts a list.

          {
            echo "build_args<<EOF"
            cat build_vars.env
            echo "EOF"
          } >> $GITHUB_OUTPUT

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            ${{ steps.envs.outputs.build_args }}
            # Pass any global secrets explicitly if needed
            # SOME_SECRET=${{ secrets.SomeSecret }}
